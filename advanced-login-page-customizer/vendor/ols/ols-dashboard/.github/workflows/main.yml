name: Releases
'on':
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: ls
      - run: npm install
      - run: npm run build
      - run: ls
      - uses: ncipollo/release-action@v1
