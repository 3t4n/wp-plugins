<div class="container_roundup" style="display: inline-block;">
	<div class="Product_Title">
		<h2><a target="_blank" class="gizzmo_link" href="{{AffiliateLink}}">{{ShortName}}</a></h2>
	</div>
	<div class="Product_Left">
		<div class="Product_Image"><a href="{{AffiliateLink}}" target="_blank" class="gizzmo_link"><img class="prod_img" src="{{ImageSource}}"/></a></div>
		{{item_rating_html}}
		<div class="Product_CTA">
			{{item_Read_All_Reviews_html}}
			{{item_CTA_html}}
		</div>
	</div>
	<div class="Product_Right">
		<div class="Product_Text">
			{{ProductText}}
		</div>
		<div class="Product_Pros">
			<div class="Pros_Title">{{pros_title}}</div>
			<div class="Pros">
				{{Pros}}
			</div>
		</div>
		<div class="Product_Cons">
			<div class="Cons_Title">{{cons_title}}</div>
			<div class="Cons">
				{{Cons}}
			</div>
		</div>
	</div>
	{{item_CTA_Mobile_html}}
	
	<input type="hidden" class="product_asin" value="{{ASIN}}">
</div>
